<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Craft - All on One</title>
    <link rel="stylesheet" href="/src/style.css"> 
</head>
<body>

<div id="container">
    <div id="game-view">
        <canvas id="gameCanvas" width="212" height="66"></canvas>
        <div id="status">Status: Disconnected</div>
    </div>
    
    <div id="chat-view">
        <div id="chat-log">
            <div class="chat-msg"><span class="system">System: </span><span class="msg-text">Welcome to ASCII Craft! Type !w, !a, !s, !d, !jump, !turnleft, etc.</span></div>
        </div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Type a command and press Enter..." autocomplete="off">
        </div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
