<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Craft - Twitch Plays</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        #container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            height: 100%;
        }
        #game-view {
            flex: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Scale the canvas up so it's visible, maintaining pixel art look */
        canvas {
            background-color: #000;
            width: 100%;
            max-width: 848px; /* 212 * 4 */
            image-rendering: pixelated; /* Keeps ASCII crisp */
            border: 2px solid #333;
            border-radius: 4px;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
            color: #888;
        }
        #chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            min-width: 250px;
        }
        #chat-log {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            word-wrap: break-word;
        }
        .chat-msg {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .chat-msg span.user { color: #00ffcc; font-weight: bold; }
        .chat-msg span.system { color: #ff5555; font-weight: bold; }
        .chat-msg span.server { color: #f1fa8c; font-weight: bold; }
        .chat-msg span.msg-text { color: #ffffff; }
        #chat-input-container {
            padding: 10px;
            background: #252525;
            border-top: 1px solid #333;
        }
        #chat-input {
            width: 100%;
            padding: 8px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }
        #chat-input:focus {
            border-color: #00ffcc;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="game-view">
        <!-- Canvas matches your 212x66 resolution config -->
        <canvas id="gameCanvas" width="212" height="66"></canvas>
        <div id="status">Status: Disconnected</div>
    </div>
    
    <div id="chat-view">
        <div id="chat-log">
            <div class="chat-msg"><span class="system">System:</span> Welcome to ASCII Craft! Type !w, !a, !s, !d, !jump, !turnleft, etc.</div>
        </div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Type a command and press Enter..." autocomplete="off">
        </div>
    </div>
</div>

<!-- Assuming your bundler outputs to bundle.js or main.js -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
