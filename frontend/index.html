<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Craft Client</title>
    <style>
    body { 
        background-color: #111; 
        color: #eee; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        font-family: monospace; 
        margin: 0;
        padding: 20px;
    }
    canvas { 
        border: 1px solid #444; 
        
        /* 1. Crucial for sharp edges when scaling up */
        image-rendering: pixelated; 
        
        /* 2. Scale up visually (5x original size) */
        width: 1060px;
        height: 330px;
        
        /* Optional: limit max width for smaller screens */
        max-width: 100%;
        height: auto;
        aspect-ratio: 212 / 66; 
    }
    </style>
  </head>
  <body>
    <h3>Status: <span id="status">Disconnected</span></h3>
    <!-- The missing element: -->
    <canvas id="gameCanvas"></canvas>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
